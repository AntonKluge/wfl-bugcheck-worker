[project]
name = "wfl-bugcheck-worker"
version = "0.1.0"
description = "Worker for validating managed deployment bug reports"
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows>=3.10",
    "pydantic",
]

[tool.uv]
exclude-newer = "2 days"
exclude-newer-package = { mistralai-workflows = false }

[[tool.uv.index]]
url = "https://socket-registry.mistralai.com/pypi/simple/"
default = true
